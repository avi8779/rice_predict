<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rice Grain Classification</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dbeafe,#eff6ff,#ffffff);
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#1d4ed8;
    font-size:30px;
    margin-bottom:8px;
}

.header p{
    color:#666;
    font-size:15px;
}

.upload-area{

    border:2px dashed #3b82f6;
    border-radius:15px;
    padding:35px 20px;
    text-align:center;
    transition:.3s;
    margin-bottom:25px;
    background:#f8fbff;

}

.upload-area:hover{

    background:#eef6ff;
    border-color:#2563eb;

}

.upload-area label{

    display:inline-block;
    background:#2563eb;
    color:white;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-weight:500;
    transition:.3s;

}

.upload-area label:hover{

    background:#1e40af;

}

.upload-area input{

    display:none;

}

.upload-area p{

    margin-top:15px;
    color:#666;

}

button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    background:#1d4ed8;
    transform:translateY(-2px);

}

.result{

    margin-top:30px;
    border-top:1px solid #ddd;
    padding-top:25px;

}

.result h2{

    color:#1d4ed8;
    margin-bottom:20px;
    text-align:center;

}

.result img{

    width:100%;
    max-width:260px;
    display:block;
    margin:auto;
    border-radius:12px;
    border:2px solid #ddd;

}

.card{

    background:#f8fafc;
    border-radius:10px;
    padding:15px;
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    font-size:16px;

}

.card b{

    color:#1d4ed8;

}

.footer{

    margin-top:25px;
    text-align:center;
    color:#777;
    font-size:13px;

}

@media(max-width:600px){

.container{

    padding:25px;

}

.header h1{

    font-size:24px;

}

button{

    font-size:16px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>Rice Grain Classification</h1>

<p>Upload a rice grain image to identify its variety.</p>

</div>

<form action="/predict" method="POST" enctype="multipart/form-data">

<div class="upload-area">

<label for="image">📁 Choose Image</label>

<input type="file" id="image" name="image" accept="image/*" required>

<p id="file-name">No image selected</p>

</div>

<button type="submit">Predict Rice Type</button>

</form>

{% if prediction %}

<div class="result">

<h2>Prediction Result</h2>

<img src="{{image}}" alt="Rice Image">

<div class="card">

<span>Rice Type</span>

<b>{{prediction}}</b>

</div>

<div class="card">

<span>Confidence</span>

<b>{{confidence}}%</b>

</div>

</div>

{% endif %}

<div class="footer">

Machine Learning Project • Random Forest Classifier

</div>

</div>

<script>

const fileInput = document.getElementById("image");
const fileName = document.getElementById("file-name");

fileInput.addEventListener("change",function(){

if(this.files.length>0){

fileName.textContent="Selected: "+this.files[0].name;

}else{

fileName.textContent="No image selected";

}

});

</script>

</body>

</html>
